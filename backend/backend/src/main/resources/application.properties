spring.application.name=backend
spring.main.allow-bean-definition-overriding=true

# ===============================
# PostgreSQL Database
# ===============================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nexhire}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED


# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# Flyway Database Migration
# ===============================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


# ===============================
# Server
# ===============================

server.port=${PORT:8080}


jwt.secret=${JWT_SECRET:nexhiredefaultjwtsecretkeywhichmustbeatleast256bitslong123456}
jwt.expiration=${JWT_SECRET_EXPIRATION:86400000}


springdoc.api-docs.path=${OPENAPI_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SWAGGAR_URL:/swagger-ui.html}

# ===============================
# Cloudinary Storage
# ===============================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456789}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secret}

storage.path=${STORAGE_PATH:./storage}

# ===============================
# RabbitMQ
# ===============================

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

#ai-resume-parser-url

ai.parser.base-url=${AI_PARSER_BASE_URL:https://apex-local-2-0.onrender.com}
ai.matcher.base-url=${AI_PARSER_BASE_URL:https://apex-local-2-0.onrender.com}
ai.interview.base-url=${AI_PARSER_BASE_URL:https://apex-local-2-0.onrender.com}
ai.skillgap.base-url=${AI_PARSER_BASE_URL:https://apex-local-2-0.onrender.com}