spring.application.name=backend
spring.main.allow-bean-definition-overriding=true

# ===============================
# PostgreSQL Database
# ===============================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED


# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# Flyway Database Migration
# ===============================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


# ===============================
# Server
# ===============================

server.port=${PORT:8080}


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_SECRET_EXPIRATION}


springdoc.api-docs.path=${OPENAPI_PATH}
springdoc.swagger-ui.path=${SWAGGAR_URL}

# ===============================
# Cloudinary Storage
# ===============================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

storage.path=${STORAGE_PATH}

# ===============================
# RabbitMQ
# ===============================

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

#ai-resume-parser-url

ai.parser.base-url=${AI_PARSER_BASE_URL}
ai.matcher.base-url=${AI_PARSER_BASE_URL}
ai.interview.base-url=${AI_PARSER_BASE_URL}
ai.skillgap.base-url=${AI_PARSER_BASE_URL}