<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Create Job — NexHire
  </title>
  <script>
   (function(){const s=localStorage.getItem('nexhire-theme');const d=matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=s||(d?'dark':'light')})();
  </script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest">
  </script>
  <link href="css/recruiter.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="app-shell">
   <aside class="sidebar">
    <a class="brand" href="recruiter_dashboard.html">
     <span class="brand-mark">
      <span>
      </span>
      <span>
      </span>
      <span>
      </span>
     </span>
     <span class="brand-name">
      Nex
      <span>
       Hire
      </span>
     </span>
    </a>
    <div class="side-label">
     RECRUITER WORKSPACE
    </div>
    <nav class="side-nav">
     <a class="side-link" href="recruiter_dashboard.html">
      <i class="nav-icon" data-lucide="layout-dashboard">
      </i>
      Dashboard
     </a>
     <a class="side-link active" href="recruiter_jobs.html">
      <i class="nav-icon" data-lucide="briefcase-business">
      </i>
      My Jobs
     </a>
     <!--
     <a class="side-link" href="recruiter_job-details.html">
      <i class="nav-icon" data-lucide="inbox">
      </i>
      Applications
     </a>
    
     <a class="side-link" href="recruiter_job-details.html">
      <i class="nav-icon" data-lucide="trophy">
      </i>
      Candidate Rankings
     </a>
     <a class="side-link" href="recruiter_candidates.html">
      <i class="nav-icon" data-lucide="users">
      </i>
      Candidates
     </a>
    -->
    </nav>
    <div class="sidebar-bottom">
     <a class="side-link" href="#">
      <i class="nav-icon" data-lucide="settings">
      </i>
      Settings
     </a>
     <a class="side-link logout" href="../recruiter-login.html">
      <i class="nav-icon" data-lucide="log-out">
      </i>
      Logout
     </a>
    </div>
   </aside>
   <div class="overlay">
   </div>
   <main class="main">
    <header class="topbar">
     <div class="top-actions">
      <button aria-label="Open menu" class="icon-button mobile-menu" data-menu="">
       <i data-lucide="menu">
       </i>
      </button>
      <span class="crumb">
       Recruiter Portal / Create Job
      </span>
     </div>
     <div class="top-actions">
      <button aria-label="Switch theme" class="icon-button" data-theme-toggle="">
       <i data-lucide="moon">
       </i>
      </button>
      <div class="profile-menu-wrap">
       <button aria-expanded="false" aria-label="Open recruiter menu" class="profile-chip" data-profile-menu="">
        <span class="avatar-sm">
         RS
        </span>
        <span class="profile-chip-name">
         Recruiter
        </span>
        <i data-lucide="chevron-down">
        </i>
       </button>
       <div class="profile-dropdown" data-profile-dropdown="">
        <a href="recruiter_profile.html">
         <i data-lucide="user-round">
         </i>
         <span>
          Profile
         </span>
        </a>
        <a href="#">
         <i data-lucide="settings">
         </i>
         <span>
          Settings
         </span>
        </a>
        <button class="dropdown-logout logout">
         <i data-lucide="log-out">
         </i>
         <span>
          Logout
         </span>
        </button>
       </div>
      </div>
     </div>
    </header>
    <section class="page">
     <div class="page-header">
      <div>
       <div class="kicker">
        HIRING
       </div>
       <h1>
        Create a Job
       </h1>
       <p>
        Publish a role and let NexHire prepare it for intelligent candidate matching.
       </p>
      </div>
     </div>
     <article class="card form-card">
      <div class="form-grid">
       <div class="field">
        <label for="job-title">
         Job Title
         <span aria-hidden="true">
          *
         </span>
        </label>
        <input id="job-title" placeholder="e.g. Java Backend Developer"/>
       </div>
       <div class="field">
        <label for="job-description">
         Job Description
         <span aria-hidden="true">
          *
         </span>
        </label>
        <textarea id="job-description" maxlength="5000" placeholder="Describe the role, responsibilities, required skills, experience and qualifications..."></textarea>
        <div class="char-row">
         <span id="char-count">
          0/5000
         </span>
        </div>
       </div>
       <div class="form-actions">
        <a class="button button-secondary" href="recruiter_jobs.html">
         Cancel
        </a>
        <button class="button button-primary" data-post-job="">
         <i data-lucide="send">
         </i>
         Post Job
        </button>
       </div>
      </div>
     </article>
    </section>
   </main>
  </div>
  <div class="toast">
  </div>
  <script src="js/recruiter.js">
  </script>
 </body>
</html>
