<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   My Jobs — NexHire
  </title>
  <script>
   (function(){const s=localStorage.getItem('nexhire-theme');const d=matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=s||(d?'dark':'light')})();
  </script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest">
  </script>
  <link href="css/recruiter.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="app-shell">
   <aside class="sidebar">
    <a class="brand" href="recruiter_dashboard.html">
     <span class="brand-mark">
      <span>
      </span>
      <span>
      </span>
      <span>
      </span>
     </span>
     <span class="brand-name">
      Nex
      <span>
       Hire
      </span>
     </span>
    </a>
    <div class="side-label">
     RECRUITER WORKSPACE
    </div>
    <nav class="side-nav">
     <a class="side-link" href="recruiter_dashboard.html">
      <i class="nav-icon" data-lucide="layout-dashboard">
      </i>
      Dashboard
     </a>
     <a class="side-link active" href="recruiter_jobs.html">
      <i class="nav-icon" data-lucide="briefcase-business">
      </i>
      My Jobs
     </a>
     <!--
     <a class="side-link" href="recruiter_job-details.html">
      <i class="nav-icon" data-lucide="inbox">
      </i>
      Applications
     </a>
    -->
     <a class="side-link" href="recruiter_job-details.html">
      <i class="nav-icon" data-lucide="trophy">
      </i>
      Candidate Rankings
     </a>
     <a class="side-link" href="recruiter_candidates.html">
      <i class="nav-icon" data-lucide="users">
      </i>
      Candidates
     </a>
    </nav>
    <div class="sidebar-bottom">
     <a class="side-link" href="#">
      <i class="nav-icon" data-lucide="settings">
      </i>
      Settings
     </a>
     <a class="side-link logout" href="../recruiter-login.html">
      <i class="nav-icon" data-lucide="log-out">
      </i>
      Logout
     </a>
    </div>
   </aside>
   <div class="overlay">
   </div>
   <main class="main">
    <header class="topbar">
     <div class="top-actions">
      <button aria-label="Open menu" class="icon-button mobile-menu" data-menu="">
       <i data-lucide="menu">
       </i>
      </button>
      <span class="crumb">
       Recruiter Portal / My Jobs
      </span>
     </div>
     <div class="top-actions">
      <button aria-label="Switch theme" class="icon-button" data-theme-toggle="">
       <i data-lucide="moon">
       </i>
      </button>
      <div class="profile-menu-wrap">
       <button aria-expanded="false" aria-label="Open recruiter menu" class="profile-chip" data-profile-menu="">
        <span class="avatar-sm">
         RS
        </span>
        <span class="profile-chip-name">
         Recruiter
        </span>
        <i data-lucide="chevron-down">
        </i>
       </button>
       <div class="profile-dropdown" data-profile-dropdown="">
        <a href="recruiter_profile.html">
         <i data-lucide="user-round">
         </i>
         <span>
          Profile
         </span>
        </a>
        <a href="#">
         <i data-lucide="settings">
         </i>
         <span>
          Settings
         </span>
        </a>
        <button class="dropdown-logout logout">
         <i data-lucide="log-out">
         </i>
         <span>
          Logout
         </span>
        </button>
       </div>
      </div>
     </div>
    </header>
    <section class="page">
     <div class="page-header">
      <div>
       <div class="kicker">
        HIRING WORKSPACE
       </div>
       <h1>
        My Jobs
       </h1>
       <p>
        Manage your active, closed and draft job postings.
       </p>
      </div>
      <a class="button button-primary" href="recruiter_create-job.html">
       <i data-lucide="plus">
       </i>
       Create Job
      </a>
     </div>
     <article class="card section-card">
      <div class="toolbar">
       <div class="search">
        <i data-lucide="search">
        </i>
        <input data-search="jobs" placeholder="Search jobs..."/>
       </div>
       <select aria-label="Filter jobs" data-filter="jobs">
        <option value="all">
         All Status
        </option>
        <option value="active">
         Active
        </option>
        <option value="closed">
         Closed
        </option>
        <option value="draft">
         Draft
        </option>
       </select>
      </div>
      <div class="table-wrap">
       <table class="data-table">
        <thead>
         <tr>
          <th>
           Job Title
          </th>
          <th>
           Status
          </th>
          <th>
           Applications
          </th>
          <th>
           Date Posted
          </th>
          <th>
           Actions
          </th>
         </tr>
        </thead>
        <tbody data-jobs-table="">
        </tbody>
       </table>
      </div>
     </article>
    </section>
   </main>
  </div>
  <div class="toast">
  </div>
  <script src="js/recruiter.js">
  </script>
 </body>
</html>
