<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applicants — NexHire Recruiter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="dashboard.html">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-name">Nex<span>Hire</span></span>
      </a>
      <div class="side-label">RECRUITER WORKSPACE</div>
      <nav class="side-nav">
        <a href="dashboard.html" class="side-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="post-job.html" class="side-link"><i data-lucide="plus-circle"></i> Post New Job</a>
        <a href="jobs.html" class="side-link active"><i data-lucide="briefcase"></i> My Jobs</a>
        <a href="profile.html" class="side-link"><i data-lucide="user"></i> Recruiter Profile</a>
        <a href="#" class="side-link logout" id="logoutBtn"><i data-lucide="log-out"></i> Logout</a>
      </nav>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main style="display: flex; flex-direction: column; min-height: 100vh;">
      <header class="topbar">
        <div class="top-actions">
          <button class="icon-button mobile-menu" id="mobileMenuBtn" aria-label="Open navigation menu">
            <i data-lucide="menu"></i>
          </button>
          <a href="jobs.html" class="crumb">&larr; Back to My Jobs</a>
        </div>
        <div class="top-actions">
          <button class="theme-toggle icon-button" aria-label="Toggle theme">
            <i data-lucide="moon"></i>
          </button>
        </div>
      </header>

      <div class="main-content">
        <div style="margin-bottom: 24px;">
          <h1 id="applicantsHeader">Job Applicants</h1>
          <p style="color: var(--text-muted);">Candidates evaluated and sorted by backend overallScore DESC, createdAt ASC.</p>
        </div>

        <div class="card">
          <div id="applicantsContainer">
            <div class="skeleton-card">
              <div class="skeleton-line skeleton-title"></div>
              <div class="skeleton-line skeleton-text"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/api/apiClient.js"></script>
  <script src="../../js/api/recruiterApi.js"></script>
  <script src="../../js/recruiter/applicants.js"></script>
</body>
</html>
