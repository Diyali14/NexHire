<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details — NexHire Candidate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../../css/theme.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="dashboard.html">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span class="brand-name">Nex<span>Hire</span></span>
      </a>
      <div class="side-label">CANDIDATE PORTAL</div>
      <nav class="side-nav">
        <a href="dashboard.html" class="side-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
        <a href="resume.html" class="side-link"><i data-lucide="file-text"></i> Resume / Upload</a>
        <a href="jobs.html" class="side-link active"><i data-lucide="briefcase"></i> Search Jobs</a>
        <a href="applications.html" class="side-link"><i data-lucide="send"></i> My Applications</a>
        <a href="interview.html" class="side-link"><i data-lucide="messages-square"></i> Interview Prep</a>
        <a href="profile.html" class="side-link"><i data-lucide="user"></i> My Profile</a>
        <a href="#" class="side-link logout" id="logoutBtn"><i data-lucide="log-out"></i> Logout</a>
      </nav>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main style="display: flex; flex-direction: column; min-height: 100vh;">
      <header class="topbar">
        <div class="top-actions">
          <button class="icon-button mobile-menu" id="mobileMenuBtn" aria-label="Open navigation menu">
            <i data-lucide="menu"></i>
          </button>
          <a href="jobs.html" class="crumb">&larr; Back to Jobs</a>
        </div>
        <div class="top-actions">
          <button class="theme-toggle icon-button" aria-label="Toggle theme">
            <i data-lucide="moon"></i>
          </button>
        </div>
      </header>

      <div class="main-content">
        <div id="jobDetailsContainer">
          <div class="skeleton-card">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-text"></div>
          </div>
        </div>

        <!-- Skill Gap Modal / Drawer -->
        <div class="modal-backdrop" id="skillGapModal">
          <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <h3>Skill Gap Analysis</h3>
              <button type="button" class="icon-button" id="closeSkillGapModal">&times;</button>
            </div>
            <div id="skillGapModalBody">
              <p>Analyzing candidate resume against job requirements...</p>
            </div>
          </div>
        </div>

        <!-- Apply Modal -->
        <div class="modal-backdrop" id="applyModal">
          <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <h3>Apply to Job</h3>
              <button type="button" class="icon-button" id="closeApplyModal">&times;</button>
            </div>
            <form id="applyForm">
              <div class="form-group">
                <label for="selectResume">Select Processed Resume</label>
                <select class="form-control" id="selectResume" required></select>
                <small style="color: var(--text-muted); margin-top: 4px;">Must select a processed resume file.</small>
              </div>
              <div id="applyStatusMsg" class="form-message" style="margin-bottom: 16px;"></div>
              <button type="submit" class="button button-primary" id="submitApplyBtn" style="width: 100%;">
                Submit Application & Start AI Matcher
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/api/apiClient.js"></script>
  <script src="../../js/api/jobApi.js"></script>
  <script src="../../js/api/resumeApi.js"></script>
  <script src="../../js/api/applicationApi.js"></script>
  <script src="../../js/candidate/job-details.js"></script>
</body>
</html>
